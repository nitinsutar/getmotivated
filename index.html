<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Get Motivated</title>
  <meta name="description" content="Hard-hitting motivational quotes. One at a time.">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Motivated">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0a0a0a; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, #141414 0%, #0a0a0a 70%); gap: 2.5rem; padding: 2rem 1rem; }
    #logo { width: 78px; height: auto; opacity: 0.95; flex-shrink: 0; }
    #quote { font-size: clamp(1.8rem, 6vw, 4.2rem); font-weight: 700; line-height: 1.2; letter-spacing: -0.03em; text-align: center; max-width: 90vw; opacity: 1; transition: opacity 0.35s ease; }
    #quote.fade { opacity: 0; }
    #next { position: fixed; bottom: 2.5rem; left: 50%; transform: translateX(-50%); font-size: 0.85rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255, 255, 255, 0.35); opacity: 0; transition: opacity 0.6s ease; pointer-events: none; line-height: 42px; }
    #next.visible { opacity: 1; }

    /* Share button - aligned with NEXT */
    #share {
      position: fixed;
      bottom: 2.5rem;
      right: 1.8rem;
      width: 42px;
      height: 42px;
      border: none;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.7s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
    }
    #share.visible {
      opacity: 0.55;
    }
    #share:hover {
      opacity: 0.95 !important;
    }
    #share svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    /* Always show share button on touch devices */
    @media (hover: none) and (pointer: coarse) {
      #share {
        opacity: 0.5 !important;
      }
    }

    @media (max-width: 600px) {
      #logo { width: 60px; }
      #quote { font-size: clamp(1.6rem, 7.5vw, 2.8rem); }
      body { gap: 2rem; }
      #next {
        bottom: 2.3rem;
        line-height: 40px;
      }
      #share {
        bottom: 2.3rem;
        right: 1.4rem;
        width: 40px;
        height: 40px;
        opacity: 0.5;
      }
      #share svg {
        width: 18px;
        height: 18px;
      }
    }
  </style>
</head>
<body>
  <img id="logo" src="/logo.png" alt="Get Motivated">
  <div id="quote"></div>
  <div id="next">Next</div>

  <button id="share" aria-label="Share quote" title="Share">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/>
    </svg>
  </button>

  <script>
    const quotes = [
      "Stop waiting for motivation. Start moving.",
      "Most people quit right before it starts working.",
      "Your future self is watching. Don’t disappoint them.",
      "Discipline is choosing what you want most over what you want now.",
      "Comfort is the enemy of progress.",
      "You don’t need more time. You need more intensity.",
      "The work is the shortcut.",
      "Nobody is coming to save you.",
      "Excuses feel good in the moment. Results feel better later.",
      "Do it scared. Do it tired. Do it anyway.",
      "Soft goals create soft people.",
      "Pain is temporary. Quitting lasts.",
      "The only thing standing between you and what you want is the story you keep telling yourself.",
      "Action cures fear.",
      "You are not behind. You are distracted.",
      "Consistency beats intensity when intensity is inconsistent.",
      "Stop romanticizing the struggle. Just do the work.",
      "Your standards are too low. Raise them.",
      "The gap between who you are and who you want to be is closed by daily action.",
      "Motivation gets you started. Discipline keeps you going.",
      "Be harder to kill.",
      "The world doesn’t care about your potential. It cares about your output.",
      "Delayed gratification is a superpower.",
      "You will never feel ready. Start anyway.",
      "Weakness is a choice. So is strength.",
      "The people who win are the ones who keep going when it feels pointless.",
      "Stop looking for the easy way. There isn’t one.",
      "Your comfort zone is a beautiful place, but nothing grows there.",
      "Make your future self proud.",
      "The work you avoid is the work that will change everything.",
      "Ambition without action is just a daydream.",
      "You can’t think your way into a new life. You have to act your way into it.",
      "Pressure is a privilege.",
      "Become the person who does hard things on purpose.",
      "Every day you waste is a day your competition doesn’t.",
      "The only bad workout is the one that didn’t happen.",
      "Stop negotiating with your excuses.",
      "Greatness is boring. It’s the same hard things done daily.",
      "You don’t rise to the level of your goals. You fall to the level of your systems.",
      "The version of you that you want is built in the moments you least feel like building it.",

      "You are not stuck. You are just refusing to choose the harder option.",
      "The longer you wait for motivation, the more you train yourself to need it.",
      "Your future is being decided by the things you keep putting off.",
      "Talent is common. Follow-through is rare.",
      "You don’t need a new plan. You need to execute the one you already have.",
      "The person you want to become is watching how you treat today.",
      "Avoiding discomfort is the fastest way to stay exactly where you are.",
      "Progress is quiet. Quitting is loud.",
      "You can either protect your comfort or protect your standards. Not both.",
      "The work doesn’t care how you feel about it.",
      "Every time you choose easy, you make the next hard thing harder.",
      "Clarity comes after action, not before it.",
      "You are building your life with the small decisions you keep ignoring.",
      "Stop waiting to feel like it. That feeling is unreliable.",
      "The cost of discipline is always lower than the cost of regret.",
      "Most people aren’t busy. They’re just avoiding the real work.",
      "You don’t need more information. You need more execution.",
      "The only way out of mediocrity is through consistent, unglamorous effort.",
      "Your standards will either pull you up or keep you down. Choose carefully.",
      "Doing it poorly is still better than not doing it at all.",
      "The harder path is usually the shorter one in the long run.",
      "You become what you repeatedly do, not what you occasionally intend.",
      "Comfort feels good until it becomes a cage.",
      "The work you do when no one is watching is the work that actually counts."
    ];

    let current = Math.floor(Math.random() * quotes.length);
    const quoteEl = document.getElementById('quote');
    const nextEl = document.getElementById('next');
    const shareBtn = document.getElementById('share');
    let fadeTimeout;
    let shareFadeTimeout;

    // Detect touch device
    const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

    function showQuote(index) {
      quoteEl.classList.add('fade');
      setTimeout(() => {
        quoteEl.textContent = quotes[index];
        quoteEl.classList.remove('fade');
      }, 180);
    }

    function nextQuote() {
      current = (current + 1) % quotes.length;
      showQuote(current);
      showNextIndicator();
    }

    function showNextIndicator() {
      nextEl.classList.add('visible');
      if (!isTouchDevice) {
        shareBtn.classList.add('visible');
      }
      clearTimeout(fadeTimeout);
      clearTimeout(shareFadeTimeout);
      fadeTimeout = setTimeout(() => {
        nextEl.classList.remove('visible');
      }, 3500);
      if (!isTouchDevice) {
        shareFadeTimeout = setTimeout(() => {
          shareBtn.classList.remove('visible');
        }, 3500);
      }
    }

    // Initial
    quoteEl.textContent = quotes[current];
    showNextIndicator();

    // On touch devices, keep share always visible
    if (isTouchDevice) {
      shareBtn.classList.add('visible');
    }

    // Interactions
    document.body.addEventListener('click', (e) => {
      if (e.target.closest('#share')) return;
      nextQuote();
    });

    document.body.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowRight') {
        e.preventDefault();
        nextQuote();
      }
    });

    let touchStartX = 0;
    document.body.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.body.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 60) {
        nextQuote();
      }
    }, { passive: true });

    document.body.addEventListener('mousemove', () => {
      if (!isTouchDevice) showNextIndicator();
    });

    // ========== SHARE FEATURE ==========
    async function generateQuoteImage() {
      const W = 1080;
      const H = 1920;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      // Background
      const gradient = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, H * 0.7);
      gradient.addColorStop(0, '#141414');
      gradient.addColorStop(1, '#0a0a0a');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);

      // Load logo
      const logo = new Image();
      logo.crossOrigin = 'anonymous';
      await new Promise((resolve, reject) => {
        logo.onload = resolve;
        logo.onerror = reject;
        logo.src = '/logo.png';
      });

      // Draw logo (centered near top)
      const logoSize = 140;
      const logoX = (W - logoSize) / 2;
      const logoY = 380;
      ctx.drawImage(logo, logoX, logoY, logoSize, logoSize * (logo.height / logo.width));

      // Draw quote text
      const text = quotes[current];
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Responsive font size based on quote length
      let fontSize = 64;
      if (text.length > 80) fontSize = 52;
      if (text.length > 110) fontSize = 44;
      if (text.length > 140) fontSize = 38;

      ctx.font = `700 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif`;

      // Word wrap
      const maxWidth = W * 0.78;
      const lineHeight = fontSize * 1.25;
      const words = text.split(' ');
      const lines = [];
      let currentLine = '';

      for (const word of words) {
        const test = currentLine ? currentLine + ' ' + word : word;
        if (ctx.measureText(test).width > maxWidth) {
          lines.push(currentLine);
          currentLine = word;
        } else {
          currentLine = test;
        }
      }
      if (currentLine) lines.push(currentLine);

      // Vertical center the text block under the logo
      const totalTextHeight = lines.length * lineHeight;
      let textY = logoY + logoSize + 120 + (totalTextHeight / 2);

      // Adjust if too low
      if (textY + totalTextHeight / 2 > H - 200) {
        textY = H / 2 + 40;
      }

      lines.forEach((line, i) => {
        const y = textY - (totalTextHeight / 2) + (i * lineHeight) + (lineHeight / 2);
        ctx.fillText(line, W / 2, y);
      });

      return canvas;
    }

    async function shareQuote(e) {
      e.stopPropagation();
      e.preventDefault();

      try {
        const canvas = await generateQuoteImage();
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 1.0));

        // Mobile: native share sheet
        if (navigator.share && navigator.canShare) {
          const file = new File([blob], 'motivation.png', { type: 'image/png' });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'Get Motivated'
            });
            return;
          }
        }

        // Desktop / fallback: download
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'motivation.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        console.error('Share failed:', err);
        // Fallback download
        try {
          const canvas = await generateQuoteImage();
          const url = canvas.toDataURL('image/png');
          const a = document.createElement('a');
          a.href = url;
          a.download = 'motivation.png';
          a.click();
        } catch (e2) {}
      }
    }

    shareBtn.addEventListener('click', shareQuote);

    // Keep share visible a bit longer on hover (desktop only)
    shareBtn.addEventListener('mouseenter', () => {
      if (!isTouchDevice) {
        clearTimeout(shareFadeTimeout);
        shareBtn.classList.add('visible');
      }
    });
    shareBtn.addEventListener('mouseleave', () => {
      if (!isTouchDevice) {
        shareFadeTimeout = setTimeout(() => {
          shareBtn.classList.remove('visible');
        }, 1800);
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>

  <!-- Vercel Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
